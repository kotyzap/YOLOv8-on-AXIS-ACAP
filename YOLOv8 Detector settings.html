document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ime-ink); }\n  footer {\n    flex:none; border-top:1px solid var(--line); background:var(--surface);\n    padding:13px 26px; display:flex; align-items:center; gap:16px;\n  }\n  button.primary {\n    font:600 13px/1 inherit; padding:10px 16px; border-radius:8px;\n    border:1px solid var(--lime); background:var(--lime); color:var(--lime-ink); cursor:pointer;\n  }\n  button.primary[disabled] { opacity:.45; cursor:default; }\n  button.ghost {\n    font:500 13px/1 inherit; padding:10px 14px; border-radius:8px;\n    border:1px solid var(--line-strong); background:var(--surface); color:var(--muted); cursor:pointer;\n  }\n  #status { font-size:12px; color:var(--muted); }\n  #status.err { color:var(--stop); }\n  #status.ok { color:var(--accent); }\n  /* gear drawer */\n  #gear {\n    width:340px; flex:none; background:var(--surface); border-left:1px solid var(--line);\n    display:none; flex-direction:column;\n  }\n  body.gear #gear { display:flex; }\n  .note {\n    display:flex; gap:9px; padding:12px 16px; background:var(--warn-soft);\n    color:var(--warn); font-size:11.5px; line-height:1.5; border-top:1px solid var(--line);\n  }\n  input[type=range] { width:100%; accent-color:var(--lime); }\n  .val { font:600 22px/1 \"IBM Plex Mono\", ui-monospace, Menlo, monospace; color:var(--lime); }\n  .live { display:grid; grid-template-columns:minmax(0,560px) minmax(0,1fr); gap:18px; align-items:start; }\n  .shot { position:relative; background:#03111a; border:1px solid var(--line); border-radius:12px; overflow:hidden; aspect-ratio:16/9; }\n  .shot img { width:100%; height:100%; object-fit:contain; display:block; }\n  .shot .off {\n    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;\n    color:#888; font-size:13px;\n  }\n  .det { display:flex; flex-direction:column; gap:6px; }\n  .det .none { font-size:13px; color:var(--faint); padding:6px 0; }\n  .drow { display:flex; align-items:center; gap:10px; font-size:13px; }\n  .drow .nm { width:96px; flex:none; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n  .bar { flex-grow:1; height:8px; border-radius:4px; background:var(--line); overflow:hidden; }\n  .bar i { display:block; height:100%; background:var(--lime); }\n  .drow.dim .nm, .drow.dim .pc { color:var(--faint); }\n  .drow.dim .bar i { background:var(--line-strong); }\n  .drow .tag {\n    font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;\n    color:var(--warn); background:var(--warn-soft); padding:2px 5px; border-radius:4px;\n  }\n  #pending {\n    font-size:11.5px; line-height:1.5; color:var(--warn); background:var(--warn-soft);\n    border-radius:7px; padding:8px 10px; margin-bottom:2px;\n  }\n  .drow .pc { width:38px; text-align:right; font-family:\"IBM Plex Mono\", ui-monospace, Menlo, monospace; font-size:12px; color:var(--muted); }\n  #fps { font-family:\"IBM Plex Mono\", ui-monospace, Menlo, monospace; }\n  @media (max-width:760px) {\n    main { flex-direction:column; height:auto; overflow:visible; }\n    aside, #gear { width:auto; border:0; border-bottom:1px solid var(--line); overflow:visible; }\n    #classlist { max-height:300px; }\n    .live { grid-template-columns:minmax(0,1fr); }\n  }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<header>\n  <span class=\"brand\">YOLOv8 <b>on AXIS<\u002Fb><\u002Fspan>\n  <span class=\"ver mono\" id=\"ver\">—<\u002Fspan>\n  <span class=\"sep\"><\u002Fspan>\n  <span class=\"pill\" id=\"runstate\"><span class=\"dot\"><\u002Fspan><span id=\"runtext\">checking…<\u002Fspan><\u002Fspan>\n  <span class=\"grow\"><\u002Fspan>\n  <button class=\"iconbtn\" id=\"themebtn\" title=\"Light / dark\">\n    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath><\u002Fsvg>\n  <\u002Fbutton>\n  <button class=\"iconbtn\" id=\"gearbtn\" title=\"Thresholds\">\n    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"><\u002Fpath><\u002Fsvg>\n  <\u002Fbutton>\n<\u002Fheader>\n\n<main>\n  <aside>\n    <div class=\"pad row\">\n      <span class=\"lbl grow full\">Classes<\u002Fspan>\n      <button class=\"iconbtn\" id=\"railbtn\" title=\"Collapse\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path id=\"railpath\" d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"pad full\" style=\"padding-top:0\"><input type=\"search\" id=\"search\" placeholder=\"Filter 80 classes\"><\u002Fdiv>\n  <div class=\"chips full\" id=\"presets\"><\u002Fdiv>\n    <div id=\"classlist\" class=\"full\"><\u002Fdiv>\n    <div class=\"asidefoot full\">\n      <strong id=\"clscount\">—<\u002Fstrong>\n      Unselected classes are skipped before NMS, so they cost nothing and never reach an event.\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <section class=\"body\">\n    <div class=\"content\">\n      <div class=\"field\">\n        <h1>Event output<\u002Fh1>\n        <p class=\"sub\">Detections stay on the camera until you send them somewhere. This build sends one camera event, which any VMS that already consumes Axis events can subscribe to.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"card field\" style=\"gap:14px\">\n        <div class=\"row\">\n          <div class=\"sw\" id=\"evon\"><i><\u002Fi><\u002Fdiv>\n          <div class=\"field\" style=\"gap:2px\">\n            <strong style=\"font-size:14px\">Camera event<\u002Fstrong>\n            <span class=\"help mono\" id=\"topic\">tnsaxis:CameraApplicationPlatform/YOLOv8Detector/Detection<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grid2\">\n          <label class=\"field\">\n            <span class=\"lbl\">Minimum duration (ms)<\u002Fspan>\n            <input type=\"number\" id=\"dur\" min=\"0\" max=\"600000\" step=\"100\">\n            <span class=\"help\">How long a class must hold above the confidence threshold before it is worth reporting.<\u002Fspan>\n          <\u002Flabel>\n          <label class=\"field\">\n            <span class=\"lbl\">Cooldown (ms)<\u002Fspan>\n            <input type=\"number\" id=\"cool\" min=\"0\" max=\"600000\" step=\"1000\">\n            <span class=\"help\">Minimum gap between two events for the same class. Absence resets the hold.<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"help\">Event data: <span class=\"mono\">class<\u002Fspan> (string), <span class=\"mono\">confidence<\u002Fspan> (double).<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"field\">\n        <div class=\"row\">\n          <span class=\"lbl grow\">Live — what the detector sees right now<\u002Fspan>\n          <span class=\"help\" id=\"fps\">—<\u002Fspan>\n          <div class=\"sw on\" id=\"liveon\"><i><\u002Fi><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"live\">\n          <div class=\"shot\" id=\"shot\"><div class=\"off\">Live view paused<\u002Fdiv><\u002Fdiv>\n          <div class=\"det\" id=\"dets\"><div class=\"none\">Waiting for the first frame…<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"help\">The boxes are drawn by the app itself, so the picture confirms both what\n        it recognised and where. The list is the same frame, decoded.<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"help\" style=\"color:var(--faint)\">MQTT, webhooks and overlay output are not built yet — this page shows only what the app can actually do.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <footer>\n      <span id=\"status\">Loading…<\u002Fspan>\n      <span class=\"grow\"><\u002Fspan>\n      <button class=\"ghost\" id=\"reload\">Revert<\u002Fbutton>\n      <button class=\"primary\" id=\"save\">Save<\u002Fbutton>\n    <\u002Ffooter>\n  <\u002Fsection>\n\n  <aside id=\"gear\">\n    <div class=\"pad row\"><span class=\"lbl grow\">Thresholds<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:6px 16px 16px; display:flex; flex-direction:column; gap:22px; flex-grow:1\">\n      <div class=\"field\" id=\"f-conf\">\n        <div class=\"row\"><span style=\"font-weight:600;flex-grow:1\">Confidence<\u002Fspan><span class=\"val\"><span data-out=\"\">55<\u002Fspan>%<\u002Fspan><\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"100\" data-key=\"ConfThresholdPercent\">\n        <span class=\"help\">Detections below this are discarded. Scores land on steps of about 4 points — the score tensor is 8-bit.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"field\" id=\"f-iou\">\n        <div class=\"row\"><span style=\"font-weight:600;flex-grow:1\">IoU<\u002Fspan><span class=\"val\"><span data-out=\"\">45<\u002Fspan>%<\u002Fspan><\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"100\" data-key=\"IouThresholdPercent\">\n        <span class=\"help\">How much two boxes may overlap before the weaker one is suppressed.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"field\" id=\"f-area\">\n        <div class=\"row\"><span style=\"font-weight:600;flex-grow:1\">Max area<\u002Fspan><span class=\"val\"><span data-out=\"\">85<\u002Fspan>%<\u002Fspan><\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"100\" data-key=\"MaxAreaPercent\">\n        <span class=\"help\">Drops boxes covering more of the frame than this. On close scenes the model emits a stable frame-filling box that overlap suppression cannot reach. 100 turns the filter off.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"note\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" style=\"flex:none;margin-top:1px\"><path d=\"M12 9v4M12 17h.01\"><\u002Fpath><path d=\"M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><\u002Fsvg>\n      <span>Reinstalling the app resets every value here to its default. Check this panel after each upload.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Faside>\n<\u002Fmain>\n\n<script>\n\"use strict\";\nconst APP = \"yolov8_detector\";\nconst GROUPS = [\n  { id: \"people\",  name: \"People\",            hint: \"the one most deployments want\",\n    items: [\"person\"] },\n  { id: \"veh\",     name: \"Vehicles\",          hint: \"road, rail, air and water\",\n    items: [\"bicycle\",\"car\",\"motorcycle\",\"bus\",\"train\",\"truck\",\"boat\",\"airplane\"] },\n  { id: \"animals\", name: \"Animals\",           hint: \"\",\n    items: [\"bird\",\"cat\",\"dog\",\"horse\",\"sheep\",\"cow\",\"elephant\",\"bear\",\"zebra\",\"giraffe\"] },\n  { id: \"street\",  name: \"Street furniture\",  hint: \"\",\n    items: [\"traffic light\",\"fire hydrant\",\"stop sign\",\"parking meter\",\"bench\"] },\n  { id: \"bags\",    name: \"Bags and carried items\", hint: \"unattended-luggage rules\",\n    items: [\"backpack\",\"handbag\",\"suitcase\",\"umbrella\",\"tie\"] },\n  { id: \"sport\",   name: \"Sports and leisure\", hint: \"\", rare: true,\n    items: [\"frisbee\",\"skis\",\"snowboard\",\"sports ball\",\"kite\",\"baseball bat\",\"baseball glove\",\"skateboard\",\"surfboard\",\"tennis racket\"] },\n  { id: \"indoor\",  name: \"Indoor and household\", hint: \"rarely useful on a camera\", rare: true,\n    items: [\"chair\",\"couch\",\"potted plant\",\"bed\",\"dining table\",\"toilet\",\"tv\",\"laptop\",\"mouse\",\"remote\",\"keyboard\",\"cell phone\",\"microwave\",\"oven\",\"toaster\",\"sink\",\"refrigerator\",\"book\",\"clock\",\"vase\",\"scissors\",\"teddy bear\",\"hair drier\",\"toothbrush\",\"bottle\",\"wine glass\",\"cup\",\"fork\",\"knife\",\"spoon\",\"bowl\"] },\n  { id: \"food\",    name: \"Food\", hint: \"\", rare: true,\n    items: [\"banana\",\"apple\",\"sandwich\",\"orange\",\"broccoli\",\"carrot\",\"hot dog\",\"pizza\",\"donut\",\"cake\"] }\n];\nconst COCO = GROUPS.reduce((a, g) => a.concat(g.items), []);\nconst PRESETS = [\n  { label: \"People only\", classes: [\"people\"] },\n  { label: \"Vehicles\",    classes: [\"veh\"] },\n  { label: \"People + vehicles\", classes: [\"people\", \"veh\"] },\n  { label: \"All 80\",      classes: GROUPS.map((g) => g.id) }\n];\n\nconst $ = (s) => document.querySelector(s);\nlet selected = new Set();\nlet loaded = null;\nlet savedClasses = \"\";\n\n/* theme ------------------------------------------------------------------ */\ntry {\n  const t = localStorage.getItem(\"yolov8-theme\");\n  if (t) document.documentElement.dataset.theme = t;\n} catch (e) { /* private mode */ }\n$(\"#themebtn\").onclick = () => {\n  const next = document.documentElement.dataset.theme === \"dark\" ? \"light\" : \"dark\";\n  document.documentElement.dataset.theme = next;\n  try { localStorage.setItem(\"yolov8-theme\", next); } catch (e) { /* ignore */ }\n};\n\n/* panels ----------------------------------------------------------------- */\n$(\"#gearbtn\").onclick = () => {\n  document.body.classList.toggle(\"gear\");\n  $(\"#gearbtn\").classList.toggle(\"on\");\n};\n$(\"#railbtn\").onclick = () => {\n  const rail = document.body.classList.toggle(\"rail\");\n  $(\"#railpath\").setAttribute(\"d\", rail ? \"M9 18l6-6-6-6\" : \"M15 18l-6-6 6-6\");\n};\n\n/* class list ------------------------------------------------------------- */\nconst shut = new Set(GROUPS.filter((g) => g.rare).map((g) => g.id));\n\nfunction svgCaret() {\n  const ns = \"http://www.w3.org/2000/svg\";\n  const svg = document.createElementNS(ns, \"svg\");\n  svg.setAttribute(\"width\", \"12\"); svg.setAttribute(\"height\", \"12\");\n  svg.setAttribute(\"viewBox\", \"0 0 24 24\"); svg.setAttribute(\"fill\", \"none\");\n  svg.setAttribute(\"stroke\", \"currentColor\"); svg.setAttribute(\"stroke-width\", \"2.4\");\n  svg.setAttribute(\"stroke-linecap\", \"round\"); svg.setAttribute(\"stroke-linejoin\", \"round\");\n  const path = document.createElementNS(ns, \"path\");\n  path.setAttribute(\"d\", \"M6 9l6 6 6-6\");\n  svg.appendChild(path);\n  return svg;\n}\n\nfunction classRow(name) {\n  const el = document.createElement(\"div\");\n  el.className = \"cls\" + (selected.has(name) ? \" on\" : \"\");\n  el.innerHTML = '<span class=\"box\"><\u002Fspan>';\n  el.appendChild(document.createTextNode(name));\n  el.onclick = () => {\n    if (selected.has(name)) {\n      if (selected.size === 1) { warnEmpty(); return; }\n      selected.delete(name);\n    } else {\n      selected.add(name);\n    }\n    drawClasses(); dirty();\n  };\n  return el;\n}\n\nfunction drawClasses() {\n  const q = $(\"#search\").value.trim().toLowerCase();\n  const list = $(\"#classlist\");\n  list.textContent = \"\";\n\n  GROUPS.forEach((g) => {\n    const items = q ? g.items.filter((n) => n.indexOf(q) !== -1) : g.items;\n    if (items.length === 0) return;\n\n    const on = g.items.filter((n) => selected.has(n)).length;\n    const head = document.createElement(\"div\");\n    head.className = \"grp\" + (on > 0 && on < g.items.length ? \" some\" : \"\") +\n                     (!q && shut.has(g.id) ? \" shut\" : \"\");\n    head.innerHTML = '<span class=\"box\"><\u002Fspan>';\n    if (on === g.items.length) head.querySelector(\".box\").style.cssText =\n      \"background:var(--accent);border-color:var(--accent)\";\n    const nm = document.createElement(\"span\");\n    nm.className = \"gname\";\n    nm.textContent = g.name;\n    const ct = document.createElement(\"span\");\n    ct.className = \"gcount\";\n    ct.textContent = on + \"/\" + g.items.length;\n    const car = document.createElement(\"span\");\n    car.className = \"caret\";\n    car.appendChild(svgCaret());\n    head.appendChild(nm); head.appendChild(ct); head.appendChild(car);\n\n    head.onclick = (ev) => {\n      if (ev.offsetX < 26) {                       // the checkbox toggles the whole group\n        if (on === g.items.length) {\n          if (selected.size === on) { warnEmpty(); return; }  // would clear everything\n          g.items.forEach((n) => selected.delete(n));\n        } else {\n          g.items.forEach((n) => selected.add(n));\n        }\n        dirty();\n      } else {                                     // anywhere else folds it\n        if (shut.has(g.id)) shut.delete(g.id); else shut.add(g.id);\n      }\n      drawClasses();\n    };\n    list.appendChild(head);\n\n    if (!q && shut.has(g.id)) return;\n    if (g.hint) {\n      const h = document.createElement(\"div\");\n      h.className = \"ghint\";\n      h.textContent = g.hint;\n      list.appendChild(h);\n    }\n    items.forEach((n) => list.appendChild(classRow(n)));\n  });\n\n  $(\"#clscount\").textContent = selected.size === COCO.length\n    ? \"All 80 classes active.\"\n    : selected.size + \" of 80 active.\";\n}\n\nfunction warnEmpty() {\n  const f = $(\"#clscount\");\n  f.textContent = \"Keep at least one class — a detector with nothing selected does nothing.\";\n  f.style.color = \"var(--warn)\";\n  setTimeout(() => { f.style.color = \"\"; drawClasses(); }, 2600);\n}\n\nfunction drawPresets() {\n  const bar = $(\"#presets\");\n  bar.textContent = \"\";\n  PRESETS.forEach((p) => {\n    const b = document.createElement(\"button\");\n    b.className = \"chip\";\n    b.textContent = p.label;\n    b.onclick = () => {\n      selected = new Set();\n      p.classes.forEach((gid) => {\n        const g = GROUPS.find((x) => x.id === gid);\n        if (g) g.items.forEach((n) => selected.add(n));\n      });\n      p.classes.forEach((gid) => shut.delete(gid));\n      drawClasses(); dirty();\n    };\n    bar.appendChild(b);\n  });\n}\n$(\"#search\").oninput = drawClasses;\n\n/* switches --------------------------------------------------------------- */\n$(\"#evon\").onclick = () => { $(\"#evon\").classList.toggle(\"on\"); dirty(); };\n\ndocument.querySelectorAll('input[type=range]').forEach((r) => {\n  r.oninput = () => {\n    r.closest(\".field\").querySelector(\"[data-out]\").textContent = r.value;\n    dirty();\n  };\n});\ndocument.querySelectorAll('input[type=number]').forEach((n) => { n.oninput = dirty; });\n\nfunction setStatus(text, cls) {\n  const s = $(\"#status\");\n  s.textContent = text;\n  s.className = cls || \"\";\n}\nfunction dirty() {\n  setStatus(\"Unsaved changes\");\n  $(\"#save\").disabled = false;\n}\n\n/* VAPIX ------------------------------------------------------------------ */\nasync function vapix(url) {\n  const r = await fetch(url, { credentials: \"same-origin\" });\n  if (!r.ok) throw new Error(\"HTTP \" + r.status);\n  return r.text();\n}\n\nasync function load() {\n  setStatus(\"Loading…\");\n  try {\n    const txt = await vapix(\"/axis-cgi/param.cgi?action=list&group=root.\" + APP);\n    const p = {};\n    txt.split(/\\r?\\n/).forEach((line) => {\n      const i = line.indexOf(\"=\");\n      if (i < 0) return;\n      const key = line.slice(0, i).split(\".\").pop();\n      p[key] = line.slice(i + 1);\n    });\n    loaded = p;\n\n    setRange(\"ConfThresholdPercent\", p.ConfThresholdPercent);\n    setRange(\"IouThresholdPercent\", p.IouThresholdPercent);\n    setRange(\"MaxAreaPercent\", p.MaxAreaPercent);\n    $(\"#dur\").value = p.EventMinDurationMs || \"1000\";\n    $(\"#cool\").value = p.EventCooldownMs || \"30000\";\n    $(\"#evon\").classList.toggle(\"on\", (p.EventsEnabled || \"yes\") === \"yes\");\n\n    savedClasses = (p.Classes || \"\").trim();\n    const names = savedClasses.split(\",\").map((s) => s.trim().toLowerCase()).filter(Boolean);\n    // A blank parameter means every class; it is never an empty selection.\n    selected = new Set(names.length ? names : COCO);\n    drawClasses();\n\n    setStatus(\"Loaded\", \"ok\");\n    $(\"#save\").disabled = true;\n  } catch (e) {\n    setStatus(\"Could not read settings: \" + e.message, \"err\");\n  }\n  status();\n}\n\nfunction setRange(key, value) {\n  const r = document.querySelector('input[data-key=\"' + key + '\"]');\n  if (!r) return;\n  if (value !== undefined) r.value = value;\n  r.closest(\".field\").querySelector(\"[data-out]\").textContent = r.value;\n}\n\nfunction rangeVal(key) {\n  return document.querySelector('input[data-key=\"' + key + '\"]').value;\n}\n\nasync function status() {\n  try {\n    const xml = await vapix(\"/axis-cgi/applications/list.cgi\");\n    const m = new RegExp('Name=\"' + APP + '\"[^>]*').exec(xml);\n    if (!m) { $(\"#runstate\").classList.add(\"off\"); $(\"#runtext\").textContent = \"not installed\"; return; }\n    const v = /Version=\"([^\"]+)\"/.exec(m[0]);\n    const s = /Status=\"([^\"]+)\"/.exec(m[0]);\n    $(\"#ver\").textContent = v ? v[1] : \"\";\n    const running = s && s[1] === \"Running\";\n    $(\"#runstate\").classList.toggle(\"off\", !running);\n    $(\"#runtext\").textContent = running ? \"Running\" : (s ? s[1] : \"unknown\");\n  } catch (e) {\n    $(\"#runstate\").classList.add(\"off\");\n    $(\"#runtext\").textContent = \"unknown\";\n  }\n}\n\n$(\"#reload\").onclick = load;\n\n$(\"#save\").onclick = async () => {\n  $(\"#save\").disabled = true;\n  setStatus(\"Saving…\");\n  const q = [\n    [\"ConfThresholdPercent\", rangeVal(\"ConfThresholdPercent\")],\n    [\"IouThresholdPercent\", rangeVal(\"IouThresholdPercent\")],\n    [\"MaxAreaPercent\", rangeVal(\"MaxAreaPercent\")],\n    [\"Classes\", selected.size === COCO.length ? \"\" : Array.from(selected).join(\",\")],\n    [\"EventsEnabled\", $(\"#evon\").classList.contains(\"on\") ? \"yes\" : \"no\"],\n    [\"EventMinDurationMs\", $(\"#dur\").value || \"0\"],\n    [\"EventCooldownMs\", $(\"#cool\").value || \"0\"]\n  ].map(([k, v]) => APP + \".\" + k + \"=\" + encodeURIComponent(v)).join(\"&\");\n\n  try {\n    const r = await vapix(\"/axis-cgi/param.cgi?action=update&\" + q);\n    if (r.trim() !== \"OK\") throw new Error(r.trim().slice(0, 80));\n    // The app watches these parameters and picks them up on its next frame.\n    savedClasses = selected.size === COCO.length ? \"\" : Array.from(selected).join(\",\");\n    setStatus(\"Saved — applied live\", \"ok\");\n    status();\n  } catch (e) {\n    setStatus(\"Save failed: \" + e.message, \"err\");\n    $(\"#save\").disabled = false;\n  }\n};\n\n/* live view ------------------------------------------------------------- */\nlet liveTimer = null;\nlet armTimer = null;\nlet liveWanted = true;\n\n// The app writes live.json to flash only while this is armed, so a page nobody\n// has open costs nothing. Re-armed well inside the app's 60 s window.\n//\n// Arming sends a fresh number every time rather than a fixed \"yes\": a parameter\n// re-written with the value it already holds may not raise a change callback in\n// the app, and then the window would expire with the page still open.\nasync function armLive(on) {\n  const v = on ? (Date.now() % 2000000000) : 0;\n  try {\n    await vapix(\"/axis-cgi/param.cgi?action=update&\" + APP + \".LiveView=\" + v);\n  } catch (e) { /* the rest of the page works without the detection list */ }\n}\n\nfunction startLive() {\n  const shot = document.getElementById(\"shot\");\n  shot.textContent = \"\";\n  const img = document.createElement(\"img\");\n  img.src = \"/axis-cgi/mjpg/video.cgi?resolution=640x360&fps=5&t=\" + Date.now();\n  img.onerror = () => {\n    shot.textContent = \"\";\n    const d = document.createElement(\"div\");\n    d.className = \"off\";\n    d.textContent = \"Video stream unavailable\";\n    shot.appendChild(d);\n  };\n  shot.appendChild(img);\n  armLive(true);\n  if (armTimer === null) armTimer = setInterval(() => armLive(true), 30000);\n  if (liveTimer === null) liveTimer = setInterval(poll, 1000);\n  poll();\n}\n\nfunction stopLive(msg) {\n  if (liveTimer !== null) { clearInterval(liveTimer); liveTimer = null; }\n  if (armTimer !== null) { clearInterval(armTimer); armTimer = null; }\n  armLive(false);\n  const shot = document.getElementById(\"shot\");\n  shot.textContent = \"\";\n  const d = document.createElement(\"div\");\n  d.className = \"off\";\n  d.textContent = msg || \"Live view paused\";\n  shot.appendChild(d);\n  document.getElementById(\"fps\").textContent = \"\\u2014\";\n}\n\nasync function poll() {\n  const box = document.getElementById(\"dets\");\n  try {\n    const r = await fetch(\"live.json?t=\" + Date.now(), { credentials: \"same-origin\", cache: \"no-store\" });\n    if (!r.ok) throw new Error(\"HTTP \" + r.status);\n    const d = await r.json();\n    document.getElementById(\"fps\").textContent = (d.fps || 0).toFixed(1) + \" fps\";\n    box.textContent = \"\";\n\n    // The app filters by the SAVED classes. Until Save, the ticks in the sidebar are\n    // a pending edit, so the list can legitimately show classes that look deselected.\n    const pendingList = selected.size === COCO.length\n      ? \"\" : Array.from(selected).sort().join(\",\");\n    const savedList = savedClasses.split(\",\").map((x) => x.trim()).filter(Boolean).sort().join(\",\");\n    if (pendingList !== savedList) {\n      const w = document.createElement(\"div\");\n      w.id = \"pending\";\n      w.textContent = \"Not saved yet — the app is still running with \" +\n        (savedClasses === \"\" ? \"all 80 classes\" : savedClasses.split(\",\").join(\", \")) +\n        \". Rows below that are not in your selection are greyed out.\";\n      box.appendChild(w);\n    }\n\n    if (!d.detections || d.detections.length === 0) {\n      const n = document.createElement(\"div\");\n      n.className = \"none\";\n      n.textContent = \"Nothing detected in this frame.\";\n      box.appendChild(n);\n      return;\n    }\n    d.detections.forEach((det) => {\n      const row = document.createElement(\"div\");\n      const off = !selected.has(det.label);\n      row.className = \"drow\" + (off ? \" dim\" : \"\");\n      const nm = document.createElement(\"span\");\n      nm.className = \"nm\";\n      nm.textContent = det.label;\n      const bar = document.createElement(\"span\");\n      bar.className = \"bar\";\n      const fill = document.createElement(\"i\");\n      fill.style.width = Math.round(det.confidence * 100) + \"%\";\n      bar.appendChild(fill);\n      const pc = document.createElement(\"span\");\n      pc.className = \"pc\";\n      pc.textContent = Math.round(det.confidence * 100) + \"%\";\n      row.appendChild(nm); row.appendChild(bar); row.appendChild(pc);\n      if (off) {\n        const t = document.createElement(\"span\");\n        t.className = \"tag\";\n        t.textContent = \"off\";\n        row.appendChild(t);\n      }\n      box.appendChild(row);\n    });\n  } catch (e) {\n    box.textContent = \"\";\n    const n = document.createElement(\"div\");\n    n.className = \"none\";\n    n.textContent = \"No live data — is the app running?\";\n    box.appendChild(n);\n    document.getElementById(\"fps\").textContent = \"—\";\n  }\n}\n\ndocument.getElementById(\"liveon\").onclick = () => {\n  liveWanted = document.getElementById(\"liveon\").classList.toggle(\"on\");\n  if (liveWanted) startLive(); else stopLive();\n};\n\n// A tab left open in the background should not keep the encoder streaming or the\n// app writing to flash.\ndocument.addEventListener(\"visibilitychange\", () => {\n  if (!liveWanted) return;\n  if (document.hidden) stopLive(\"Live view paused \\u2014 tab not visible\");\n  else startLive();\n});\nwindow.addEventListener(\"pagehide\", () => {\n  try {\n    fetch(\"/axis-cgi/param.cgi?action=update&\" + APP + \".LiveView=0\",\n          { credentials: \"same-origin\", keepalive: true });\n  } catch (e) { /* best effort on the way out */ }\n});\n\ndrawPresets();\ndrawClasses();\nload();\nstartLive();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
