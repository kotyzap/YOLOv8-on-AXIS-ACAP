  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-display: swap;\n  src: url(\"ab1f2979-1451-4e66-8d8e-7e267b326137\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e3845d93-3b8e-4c07-9ef3-13047a024d72\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b656b72d-26c1-49df-a929-8a5a5f46e666\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ab1f2979-1451-4e66-8d8e-7e267b326137\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#071a24;color:#e8f1f4;font-family:\"Space Grotesk\",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-wrap:pretty}\na{color:#c9f31d;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(201,243,29,.4)}\na:hover{text-decoration-color:#c9f31d}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<header style=\"display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.1);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#9db4bd\">\n  <a href=\"https://www.4xs.dev\" style=\"color:#e8f1f4;text-decoration:none\"><b>4XS.DEV<\u002Fb> / prototypes<\u002Fa>\n  <span style=\"flex:1\"><\u002Fspan>\n  <a href=\"https://github.com/kotyzap/YOLOv8-on-AXIS-ACAP\" style=\"color:#071a24;background:#c9f31d;text-decoration:none;padding:8px 14px;border-radius:6px;font-weight:600\">GitHub<\u002Fa>\n<\u002Fheader>\n\n<!-- HERO -->\n<section data-screen-label=\"Hero\" style=\"position:relative;display:grid;grid-template-columns:minmax(0,1fr);max-width:1400px;margin:0 auto;padding:32px 24px 0\">\n  <div style=\"position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.12)\">\n    <img src=\"727f595a-ce3c-49de-8008-24e3883548fd\" alt=\"An AXIS bullet camera beside an ARTPEC-8 chip, with a street scene showing detected people and vehicles.\" style=\"display:block;width:100%;height:auto\">\n    <sc-if value=\"{{ showCaption }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;left:0;right:0;bottom:0;padding:10px 16px;background:linear-gradient(transparent,rgba(7,26,36,.9));font-family:'IBM Plex Mono',monospace;font-size:12px;color:#9db4bd\">Promotional illustration. Detection overlays shown are not real output — see the measured results below.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"padding:48px 0 24px;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:end\">\n    <div>\n      <h1 style=\"margin:0 0 16px;font-size:clamp(48px,8vw,104px);line-height:.95;letter-spacing:-.03em;font-weight:700\">YOLOv8<br>on <span style=\"color:#c9f31d\">AXIS<\u002Fspan><\u002Fh1>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;padding:6px 12px;border-radius:999px;background:#c9f31d;color:#071a24;font-weight:600\">PROTOTYPE<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:#9db4bd\">ARTPEC-8<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:#9db4bd\">AXIS OS 12 / 13<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:#9db4bd\">ACAP Native SDK<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:#9db4bd\">AGPL-3.0<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:clamp(22px,2.6vw,30px);line-height:1.35;color:#c5d6dc\">Stock COCO YOLOv8n running on the camera's own DLPU. 80 classes, on real hardware, no server, no cloud.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 01 -->\n<section data-screen-label=\"01 What it is\" style=\"max-width:1400px;margin:0 auto;padding:56px 24px;border-top:1px solid rgba(255,255,255,.1);display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))\">\n  <div>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#2fe0e8;margin-bottom:14px\">01 / What it is<\u002Fdiv>\n    <h2 style=\"margin:0 0 24px;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-.02em;font-weight:700\">Nothing leaves the camera.<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:20px;line-height:1.55;color:#c5d6dc\">An ACAP that loads a quantized YOLOv8n into larod on an AXIS Q1656, decodes the detection head on the camera's own CPU, draws bounding boxes on the live stream, and publishes detections as a native Axis camera event that any VMS can subscribe to. Nothing leaves the camera.<\u002Fp>\n    <p style=\"margin:0 0 18px;font-size:20px;line-height:1.55;color:#c5d6dc\">It is a weekend project — me teaching an Axis camera a new trick, and pushing the envelope to find out where it breaks. Claude Code wrote most of the lines. The hardware, the domain judgement and the debugging are mine.<\u002Fp>\n    <p style=\"margin:0;font-size:20px;line-height:1.55;color:#c5d6dc\">The point is the pipeline, not the class list: an arbitrary detector, quantized, running on the camera itself, with a settings UI and VMS events. Swapping in a model trained on something you actually care about is the interesting direction.<\u002Fp>\n  <\u002Fdiv>\n  <!-- pipeline infographic -->\n  <div style=\"display:grid;gap:10px;align-content:center\">\n    <div style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;padding:18px 20px;border-radius:12px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n      <div style=\"width:44px;height:44px;border-radius:50%;background:rgba(47,224,232,.15);color:#2fe0e8;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:600\">1<\u002Fdiv>\n      <div><div style=\"font-size:20px;font-weight:700\">Sensor frame<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">16:9 live stream<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:22px;width:2px;background:#2fe0e8;margin-left:41px\"><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;padding:18px 20px;border-radius:12px;background:#0c2431;border:1px solid #c9f31d\">\n      <div style=\"width:44px;height:44px;border-radius:50%;background:#c9f31d;color:#071a24;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:600\">2<\u002Fdiv>\n      <div><div style=\"font-size:20px;font-weight:700\">YOLOv8n on the DLPU<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">larod · quantized int8 · DFL head included<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:22px;width:2px;background:#2fe0e8;margin-left:41px\"><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;padding:18px 20px;border-radius:12px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n      <div style=\"width:44px;height:44px;border-radius:50%;background:rgba(47,224,232,.15);color:#2fe0e8;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:600\">3<\u002Fdiv>\n      <div><div style=\"font-size:20px;font-weight:700\">Decode + NMS on the CPU<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">worker thread · 8400 anchors × 80 classes<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:22px;width:2px;background:#2fe0e8;margin-left:41px\"><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n      <div style=\"padding:18px 20px;border-radius:12px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\"><div style=\"font-size:18px;font-weight:700\">Boxes on the live stream<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">overlay<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:18px 20px;border-radius:12px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\"><div style=\"font-size:18px;font-weight:700\">Native Axis event<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">any VMS can subscribe<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 -->\n<section data-screen-label=\"02 Measured\" style=\"max-width:1400px;margin:0 auto;padding:56px 24px;border-top:1px solid rgba(255,255,255,.1)\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#2fe0e8;margin-bottom:14px\">02 / What actually got measured<\u002Fdiv>\n  <h2 style=\"margin:0 0 12px;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-.02em;font-weight:700\">Numbers from the repo, not estimates.<\u002Fh2>\n  <p style=\"margin:0 0 32px;font-size:20px;line-height:1.55;color:#c5d6dc;max-width:70ch\">Inference figures are from the 640×640 model on an AXIS Q1656.<\u002Fp>\n  <div style=\"display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))\">\n    <div style=\"padding:28px 24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n      <div style=\"font-size:clamp(56px,7vw,88px);line-height:1;font-weight:700;letter-spacing:-.04em;color:#c9f31d\">54<span style=\"font-size:.4em;color:#9db4bd;letter-spacing:0;margin-left:4px\">ms<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:18px;line-height:1.4\">Inference per frame on <code style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;color:#2fe0e8\">axis-a8-dlpu-tflite<\u002Fcode><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:28px 24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n      <div style=\"font-size:clamp(56px,7vw,88px);line-height:1;font-weight:700;letter-spacing:-.04em;color:#c9f31d\">14<span style=\"font-size:.4em;color:#9db4bd;letter-spacing:0;margin-left:4px\">ms<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:18px;line-height:1.4\">CPU decode + NMS, 8400 anchors × 80 classes<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:28px 24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n      <div style=\"font-size:clamp(56px,7vw,88px);line-height:1;font-weight:700;letter-spacing:-.04em;color:#c9f31d\">~12.5<span style=\"font-size:.4em;color:#9db4bd;letter-spacing:0;margin-left:4px\">fps<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:18px;line-height:1.4\">End-to-end, ~80 ms before pipelining<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:28px 24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n      <div style=\"font-size:clamp(56px,7vw,88px);line-height:1;font-weight:700;letter-spacing:-.04em;color:#2fe0e8\">yes<\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:18px;line-height:1.4\">Whole graph on the DLPU, DFL head included<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <!-- pipelining timeline -->\n  <div style=\"margin-top:32px;padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9db4bd;margin-bottom:16px\">Pipelined loop · frame N decodes while N+1 is on the DLPU<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px 14px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:13px\">\n      <div style=\"color:#9db4bd\">DLPU<\u002Fdiv>\n      <div style=\"display:flex;gap:4px\">\n        <div style=\"flex:54;height:34px;border-radius:6px;background:#c9f31d;color:#071a24;display:grid;place-items:center;font-weight:600\">N · 54 ms<\u002Fdiv>\n        <div style=\"flex:54;height:34px;border-radius:6px;background:#c9f31d;color:#071a24;display:grid;place-items:center;font-weight:600\">N+1<\u002Fdiv>\n        <div style=\"flex:54;height:34px;border-radius:6px;background:#c9f31d;color:#071a24;display:grid;place-items:center;font-weight:600\">N+2<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"color:#9db4bd\">CPU<\u002Fdiv>\n      <div style=\"display:flex;gap:4px\">\n        <div style=\"flex:54;height:34px\"><\u002Fdiv>\n        <div style=\"flex:14;height:34px;border-radius:6px;background:#2fe0e8;color:#071a24;display:grid;place-items:center;font-weight:600\">N<\u002Fdiv>\n        <div style=\"flex:40;height:34px\"><\u002Fdiv>\n        <div style=\"flex:14;height:34px;border-radius:6px;background:#2fe0e8;color:#071a24;display:grid;place-items:center;font-weight:600\">N+1<\u002Fdiv>\n        <div style=\"flex:40;height:34px\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:18px 0 0;font-size:18px;line-height:1.5;color:#c5d6dc\">Decoding now runs on a worker thread — frame N is decoded while frame N+1 is on the DLPU — so the loop is inference-bound. The cost is one frame of lag between video and overlay, which is not visible at these rates.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 -->\n<section data-screen-label=\"03 Aspect ratio\" style=\"max-width:1400px;margin:0 auto;padding:56px 24px;border-top:1px solid rgba(255,255,255,.1)\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#2fe0e8;margin-bottom:14px\">03 / The aspect-ratio finding<\u002Fdiv>\n  <h2 style=\"margin:0 0 12px;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-.02em;font-weight:700\">Thirty points of recall from nothing but aspect ratio.<\u002Fh2>\n  <div style=\"display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));margin-top:24px\">\n    <div>\n      <p style=\"margin:0 0 18px;font-size:20px;line-height:1.55;color:#c5d6dc\">The result worth the weekend. larod's <code style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#2fe0e8\">convert<\u002Fcode> preprocessor scales the frame to the model input <strong style=\"color:#e8f1f4\">without letterboxing<\u002Fstrong>, so a square model sees a 16:9 scene squashed to about 56 % of its width — nothing like the photographs COCO was trained on.<\u002Fp>\n      <p style=\"margin:0;font-size:20px;line-height:1.55;color:#c5d6dc\">Re-exported at 384×640 and scored against the float32 PyTorch model, on 28 images held out of both models' calibration sets, decoded exactly as the ACAP decodes:<\u002Fp>\n    <\u002Fdiv>\n    <!-- squash diagram -->\n    <div style=\"display:grid;grid-template-columns:minmax(0,16fr) 48px minmax(0,9fr);gap:12px;align-items:center;padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n      <div>\n        <div style=\"aspect-ratio:16/9;border:2px solid #2fe0e8;border-radius:6px;display:grid;place-items:center;background:repeating-linear-gradient(135deg,rgba(47,224,232,.12) 0 6px,transparent 6px 14px)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#2fe0e8;background:#0c2431;padding:4px 8px;border-radius:4px\">16:9 sensor<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;color:#c9f31d;font-size:28px\">→<\u002Fdiv>\n      <div>\n        <div style=\"aspect-ratio:1/1;border:2px solid #c9f31d;border-radius:6px;display:grid;place-items:center;background:repeating-linear-gradient(135deg,rgba(201,243,29,.12) 0 3px,transparent 3px 8px)\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#c9f31d;background:#0c2431;padding:4px 8px;border-radius:4px;text-align:center\">640×640<br>squashed<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd;text-align:center\">No letterboxing: the scene is compressed to ~56 % of its width<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <!-- bar charts -->\n  <div style=\"display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));margin-top:32px\">\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n      <div style=\"font-size:18px;font-weight:700;margin-bottom:4px\">Frames cropped to 16:9<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd;margin-bottom:20px\">what the camera actually delivers · recall<\u002Fdiv>\n      <div style=\"display:grid;gap:14px\">\n        <div style=\"display:grid;gap:6px\">\n          <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:14px\"><span>square · 640×640<\u002Fspan><span style=\"color:#9db4bd\">19 false positives<\u002Fspan><\u002Fdiv>\n          <div style=\"height:44px;border-radius:6px;background:rgba(255,255,255,.06)\"><div style=\"width:57.5%;height:100%;border-radius:6px;background:#3d5a66;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-weight:700;font-size:22px\">57.5 %<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:6px\">\n          <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:14px\"><span style=\"color:#c9f31d\">rectangular · 384×640<\u002Fspan><span style=\"color:#9db4bd\">11 false positives<\u002Fspan><\u002Fdiv>\n          <div style=\"height:44px;border-radius:6px;background:rgba(255,255,255,.06)\"><div style=\"width:87.6%;height:100%;border-radius:6px;background:#c9f31d;color:#071a24;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-weight:700;font-size:22px\">87.6 %<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n      <div style=\"font-size:18px;font-weight:700;margin-bottom:4px\">The same images uncropped<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd;margin-bottom:20px\">ordinary ~4:3 photos · recall<\u002Fdiv>\n      <div style=\"display:grid;gap:14px\">\n        <div style=\"display:grid;gap:6px\">\n          <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:14px\"><span style=\"color:#c9f31d\">square · 640×640<\u002Fspan><span style=\"color:#9db4bd\">16 false positives<\u002Fspan><\u002Fdiv>\n          <div style=\"height:44px;border-radius:6px;background:rgba(255,255,255,.06)\"><div style=\"width:65.3%;height:100%;border-radius:6px;background:#c9f31d;color:#071a24;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-weight:700;font-size:22px\">65.3 %<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:6px\">\n          <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:14px\"><span>rectangular · 384×640<\u002Fspan><span style=\"color:#9db4bd\">9 false positives<\u002Fspan><\u002Fdiv>\n          <div style=\"height:44px;border-radius:6px;background:rgba(255,255,255,.06)\"><div style=\"width:51.6%;height:100%;border-radius:6px;background:#3d5a66;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-weight:700;font-size:22px\">51.6 %<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:32px 0 0;font-size:22px;line-height:1.5;color:#c5d6dc;max-width:80ch\">Thirty points of recall, in both directions, from nothing but aspect ratio. The lesson is not that rectangular is better — it is that <strong style=\"color:#e8f1f4\">the model's aspect ratio has to match the sensor's<\u002Fstrong>, and that getting it wrong costs more than most of the tuning anyone bothers with. The rectangular model also uses 40 % fewer input pixels.<\u002Fp>\n<\u002Fsection>\n\n<!-- 04 -->\n<section data-screen-label=\"04 Quantization\" style=\"max-width:1400px;margin:0 auto;padding:56px 24px;border-top:1px solid rgba(255,255,255,.1)\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#2fe0e8;margin-bottom:14px\">04 / The quantization trap<\u002Fdiv>\n  <h2 style=\"margin:0 0 24px;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-.02em;font-weight:700\">One scale for boxes and scores. Every score rounds to zero.<\u002Fh2>\n  <div style=\"display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))\">\n    <div>\n      <p style=\"margin:0 0 18px;font-size:20px;line-height:1.55;color:#c5d6dc\">Worth knowing if you ever quantize a YOLOv8 yourself. Ultralytics' single <code style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#2fe0e8\">output0<\u002Fcode> concatenates box coordinates, which range 0..~650, with class scores, which range 0..1. Per-tensor int8 quantization then picks <strong style=\"color:#e8f1f4\">one scale for both<\u002Fstrong>, around 2.54. Every class score below ~1.27 rounds to zero, and the exported model detects nothing at all — silently, with no error anywhere.<\u002Fp>\n      <p style=\"margin:0;font-size:20px;line-height:1.55;color:#c5d6dc\">The fix is to cut the graph before the final <code style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#2fe0e8\">Concat<\u002Fcode> so boxes and scores become two tensors with their own quantization scales. The ACAP tells them apart by byte size rather than index, because larod does not guarantee output order.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:12px;align-content:start\">\n      <!-- range diagram -->\n      <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9db4bd;margin-bottom:14px\">Single output0 · one int8 scale ≈ 2.54<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px 12px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:13px\">\n          <span style=\"color:#9db4bd\">boxes<\u002Fspan><div style=\"height:28px;border-radius:5px;background:#3d5a66;display:flex;align-items:center;padding-left:10px\">0 … ~650<\u002Fdiv>\n          <span style=\"color:#9db4bd\">scores<\u002Fspan><div style=\"height:28px;position:relative;border-radius:5px;background:rgba(255,255,255,.06)\"><div style=\"width:2px;height:100%;background:#ff6b6b;position:absolute;left:0\"><\u002Fdiv><span style=\"position:absolute;left:10px;top:5px;color:#ff6b6b\">0 … 1 → rounds to 0<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- scores bars -->\n      <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9db4bd;margin-bottom:14px\">Maximum class score on the same test image<\u002Fdiv>\n        <div style=\"display:grid;gap:12px\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:12px;align-items:center\"><div style=\"height:40px;border-radius:6px;background:rgba(255,255,255,.06)\"><div style=\"width:66.5%;height:100%;border-radius:6px;background:#3d5a66;display:flex;align-items:center;padding-left:12px;font-size:15px\">float32 reference<\u002Fdiv><\u002Fdiv><div style=\"font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;text-align:right\">0.665<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:12px;align-items:center\"><div style=\"height:40px;border-radius:6px;background:rgba(255,107,107,.1);border:1px dashed #ff6b6b;display:flex;align-items:center;padding-left:12px;font-size:15px;color:#ff6b6b\">single-output int8<\u002Fdiv><div style=\"font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;text-align:right;color:#ff6b6b\">0.000<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:12px;align-items:center\"><div style=\"height:40px;border-radius:6px;background:rgba(255,255,255,.06)\"><div style=\"width:62.5%;height:100%;border-radius:6px;background:#c9f31d;color:#071a24;display:flex;align-items:center;padding-left:12px;font-size:15px;font-weight:600\">split-output int8<\u002Fdiv><\u002Fdiv><div style=\"font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;text-align:right;color:#c9f31d\">0.625<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 -->\n<section data-screen-label=\"05 Cameras\" style=\"max-width:1400px;margin:0 auto;padding:56px 24px;border-top:1px solid rgba(255,255,255,.1)\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#2fe0e8;margin-bottom:14px\">05 / Which cameras<\u002Fdiv>\n  <h2 style=\"margin:0 0 12px;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-.02em;font-weight:700\">This does not travel as far as it looks.<\u002Fh2>\n  <p style=\"margin:0 0 32px;font-size:20px;line-height:1.55;color:#c5d6dc;max-width:70ch\">The DLPU model format is not the same across Axis SoCs.<\u002Fp>\n  <div style=\"display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))\">\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:2px solid #c9f31d;display:grid;gap:10px;align-content:start\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#071a24;background:#c9f31d;padding:4px 8px;border-radius:4px;justify-self:start;font-weight:600\">verified<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em\">ARTPEC-8<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">TFLite int8<\u002Fdiv>\n      <div style=\"font-size:16px;line-height:1.45;color:#c5d6dc\">AXIS Q1656, AXIS OS 12.11<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1);display:grid;gap:10px;align-content:start\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#2fe0e8;border:1px solid #2fe0e8;padding:4px 8px;border-radius:4px;justify-self:start\">should work<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em\">ARTPEC-9<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">TFLite int8<\u002Fdiv>\n      <div style=\"font-size:16px;line-height:1.45;color:#c5d6dc\">untested<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1);display:grid;gap:10px;align-content:start\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9db4bd;border:1px solid rgba(255,255,255,.2);padding:4px 8px;border-radius:4px;justify-self:start\">untested<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em\">ARTPEC-7<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">TFLite int8<\u002Fdiv>\n      <div style=\"font-size:16px;line-height:1.45;color:#c5d6dc\">probably too slow<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1);display:grid;gap:10px;align-content:start;opacity:.7\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#ff6b6b;border:1px solid #ff6b6b;padding:4px 8px;border-radius:4px;justify-self:start\">no<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em\">CV25<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">Ambarella CVflow .bin<\u002Fdiv>\n      <div style=\"font-size:16px;line-height:1.45;color:#c5d6dc\">different toolchain<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1);display:grid;gap:10px;align-content:start;opacity:.7\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#ff6b6b;border:1px solid #ff6b6b;padding:4px 8px;border-radius:4px;justify-self:start\">no<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em\">CV75<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9db4bd\">proprietary, from ONNX<\u002Fdiv>\n      <div style=\"font-size:16px;line-height:1.45;color:#c5d6dc\">&nbsp;<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:32px 0 0;font-size:20px;line-height:1.55;color:#c5d6dc;max-width:80ch\">If the device named in <code style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#2fe0e8\">runOptions<\u002Fcode> is absent, the app enumerates what larod does offer, picks a DLPU, logs the substitution and carries on — so an ARTPEC-9 product should load the same <code style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#2fe0e8\">.tflite<\u002Fcode> without a rebuild. That path has never run on real ARTPEC-9 hardware. CV25 and CV75 are a port, not a flag: they take a proprietary format converted through Ambarella's toolchain.<\u002Fp>\n<\u002Fsection>\n\n<!-- 06 -->\n<section data-screen-label=\"06 What this is not\" style=\"max-width:1400px;margin:0 auto;padding:56px 24px;border-top:1px solid rgba(255,255,255,.1)\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#2fe0e8;margin-bottom:14px\">06 / What this is not<\u002Fdiv>\n  <div style=\"padding:28px;border-radius:14px;background:rgba(201,243,29,.08);border:1px solid #c9f31d;margin-bottom:12px;font-size:22px;line-height:1.45\">\n    <strong style=\"color:#c9f31d\">It takes the DLPU exclusively.<\u002Fstrong> The manifest declares <code style=\"font-family:'IBM Plex Mono',monospace;font-size:18px;color:#2fe0e8\">deepLearningProcessor.required<\u002Fcode>, so AXIS Object Analytics must be stopped before this app will start. You are trading AOA for this, not adding it.\n  <\u002Fdiv>\n  <div style=\"display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))\">\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\"><div style=\"font-size:22px;font-weight:700;line-height:1.25;margin-bottom:10px\">COCO is a photo dataset, not a surveillance dataset.<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#c5d6dc\">It was trained on hand-held pictures, not on a camera at 4 m looking down a car park in the rain at 2 a.m. AOA is trained for that and will beat this comfortably on the classes it covers. The aspect-ratio numbers above show what a mismatch costs — and scene domain is a bigger mismatch than aspect ratio.<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\"><div style=\"font-size:22px;font-weight:700;line-height:1.25;margin-bottom:10px\">Most of the 80 classes are useless on a camera.<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#c5d6dc\">COCO includes toaster, hair drier and broccoli. Perhaps 15 of the 80 will ever fire meaningfully in a surveillance scene.<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\"><div style=\"font-size:22px;font-weight:700;line-height:1.25;margin-bottom:10px\">No tracking, no scenarios, no counting, no calibration.<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#c5d6dc\">Detections are per-frame. No line crossing, no time-in-area, no object identity across frames.<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\"><div style=\"font-size:22px;font-weight:700;line-height:1.25;margin-bottom:10px\">The current model's speed is unmeasured.<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#c5d6dc\">Only the 640×640 model has been timed on hardware. The 384×640 one should be faster; that is a prediction.<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:24px;border-radius:14px;background:#0c2431;border:1px solid rgba(255,255,255,.1)\"><div style=\"font-size:22px;font-weight:700;line-height:1.25;margin-bottom:10px\">Tested on exactly one camera<\u002Fdiv><div style=\"font-size:17px;line-height:1.5;color:#c5d6dc\">— an AXIS Q1656 on AXIS OS 12.11.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 07 -->\n<section data-screen-label=\"07 Get it\" style=\"max-width:1400px;margin:0 auto;padding:56px 24px;border-top:1px solid rgba(255,255,255,.1);display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))\">\n  <div>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#2fe0e8;margin-bottom:14px\">07 / Get it<\u002Fdiv>\n    <h2 style=\"margin:0 0 20px;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-.02em;font-weight:700\">Needs Docker and the ACAP Native SDK image.<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:20px;line-height:1.55;color:#c5d6dc\">Re-export the model — different input size, different calibration set, your own weights — with <code style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#2fe0e8\">sh tools/export_yolov8.sh<\u002Fcode>. The build refuses to run if the committed quantization header and the model file have drifted apart.<\u002Fp>\n    <p style=\"margin:0;font-size:20px;line-height:1.55;color:#c5d6dc\"><a href=\"https://github.com/kotyzap/YOLOv8-on-AXIS-ACAP\">Read the code<\u002Fa>. It includes <code style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#2fe0e8\">improvements.md<\u002Fcode>, a full code review of this repo and what came of it.<\u002Fp>\n  <\u002Fdiv>\n  <pre style=\"margin:0;padding:24px;border-radius:14px;background:#03111a;border:1px solid rgba(255,255,255,.1);overflow-x:auto;font-family:'IBM Plex Mono',monospace;font-size:15px;line-height:1.7;color:#c5d6dc\"><code>git clone https://github.com/kotyzap/YOLOv8-on-AXIS-ACAP\ncd YOLOv8-on-AXIS-ACAP\nsh acap/build.sh\n\ncurl --digest -u root:PASS -F \"packfil=@acap/YOLOv8_Detector_0_9_4_aarch64.eap\" \\\n  \"http://CAMERA/axis-cgi/applications/upload.cgi\"<\u002Fcode><\u002Fpre>\n<\u002Fsection>\n\n<!-- 08 -->\n<section data-screen-label=\"08 Licence\" style=\"max-width:1400px;margin:0 auto;padding:56px 24px;border-top:1px solid rgba(255,255,255,.1)\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#2fe0e8;margin-bottom:14px\">08 / Licence<\u002Fdiv>\n  <h2 style=\"margin:0 0 20px;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-.02em;font-weight:700\">AGPL-3.0<\u002Fh2>\n  <p style=\"margin:0 0 18px;font-size:20px;line-height:1.55;color:#c5d6dc;max-width:80ch\"><strong style=\"color:#e8f1f4\">AGPL-3.0<\u002Fstrong>, and not as a stylistic choice: this repo ships a model derived from Ultralytics YOLOv8, which is AGPL-3.0, and Ultralytics reads that as covering the whole derivative work. To build something closed on top of this you need either an Ultralytics Enterprise licence or a different model — several good detectors are Apache-2.0. I am not a lawyer and this is not legal advice.<\u002Fp>\n  <p style=\"margin:0;font-size:20px;line-height:1.55;color:#c5d6dc;max-width:80ch\">The ACAP skeleton derives from Axis's <code style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;color:#2fe0e8\">object-detection-yolov5<\u002Fcode> example (Apache-2.0), which is one-way compatible into AGPL-3.0.<\u002Fp>\n<\u002Fsection>\n\n<footer style=\"max-width:1400px;margin:0 auto;padding:40px 24px 64px;border-top:1px solid rgba(255,255,255,.1);font-size:16px;line-height:1.6;color:#9db4bd\">\n  <p style=\"margin:0 0 12px\">Built by <a href=\"https://www.4xs.dev\">Pavel Kotyza<\u002Fa> — <a href=\"mailto:kotyza@gmail.com\">kotyza@gmail.com<\u002Fa> · <a href=\"https://github.com/kotyzap\">GitHub<\u002Fa><\u002Fp>\n  <p style=\"margin:0 0 20px\">A weekend hobby project: teaching Axis cameras a new trick, and pushing the envelope. Claude Code wrote most of the lines.<\u002Fp>\n  <sc-if value=\"{{ showDisclaimer }}\" hint-placeholder-val=\"{{ true }}\">\n  <p style=\"margin:0;padding-top:16px;border-top:1px dashed rgba(255,255,255,.15);font-size:14px;line-height:1.7\">\n    <strong style=\"color:#c5d6dc\">My personal after-hours vibe coded <a href=\"https://www.4xs.dev\">4XS.dev<\u002Fa> experiments are not products, and not affiliated with or endorsed by Axis Communications.<\u002Fstrong><br>\n    Not affiliated with, endorsed by or supported by CamStreamer s.r.o. either. AXIS, ARTPEC and AXIS Object Analytics are trademarks of Axis Communications AB; CamStreamer, CamOverlay, CamSwitcher and CamScripter are trademarks of CamStreamer s.r.o. Used here only to identify the hardware and software this project runs on. No warranty. Use at your own risk.\n  <\u002Fp>\n  <\u002Fsc-if>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showCaption&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showDisclaimer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showCaption: this.props.showCaption ?? true,\n      showDisclaimer: this.props.showDisclaimer ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
